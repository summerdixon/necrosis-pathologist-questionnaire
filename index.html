<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Necrosis Pathologist Questionnaire</title>
</head>
<body>
    <div id="app">
        <header>
            <h1>Necrosis Pathologist Questionnaire</h1>
        </header>

        <main>
            <div id="question">
                <h2 id="question-title">Question 1</h2>
                <img id="question-image" src="images/img_1.jpeg">
                <div id="question-fields">
                    <form id="questionForm">
                        <p>Existence of Staining Artifacts</p>
                        <input type="radio" id="artifacts1" name="artifacts" value="1">
                        <label for="artifacts1">1</label><br>
                        <input type="radio" id="artifacts2" name="artifacts" value="2">
                        <label for="artifacts2">2</label><br>
                        <input type="radio" id="artifacts3" name="artifacts" value="3">
                        <label for="artifacts3">3</label><br>
                        <input type="radio" id="artifacts4" name="artifacts" value="4">
                        <label for="artifacts4">4</label><br>
                        <p>Extracellular Detail</p>
                        <input type="radio" id="extracellular1" name="extracellular" value="1">
                        <label for="extracellular1">1</label><br>
                        <input type="radio" id="extracellular2" name="extracellular" value="2">
                        <label for="extracellular2">2</label><br>
                        <input type="radio" id="extracellular3" name="extracellular" value="3">
                        <label for="extracellular3">3</label><br>
                        <input type="radio" id="extracellular4" name="extracellular" value="4">
                        <label for="extracellular4">4</label><br>
                        <p>Cytoplasmic Detail</p>
                        <input type="radio" id="cytoplasmic1" name="cytoplasmic" value="1">
                        <label for="cytoplasmic1">1</label><br>
                        <input type="radio" id="cytoplasmic2" name="cytoplasmic" value="2">
                        <label for="cytoplasmic2">2</label><br>
                        <input type="radio" id="cytoplasmic3" name="cytoplasmic" value="3">
                        <label for="cytoplasmic3">3</label><br>
                        <input type="radio" id="cytoplasmic4" name="cytoplasmic" value="4">
                        <label for="cytoplasmic4">4</label><br>
                        <p>Nuclear Detail</p>
                        <input type="radio" id="nuclear1" name="nuclear" value="1">
                        <label for="nuclear1">1</label><br>
                        <input type="radio" id="nuclear2" name="nuclear" value="2">
                        <label for="nuclear2">2</label><br>
                        <input type="radio" id="nuclear3" name="nuclear" value="3">
                        <label for="nuclear3">3</label><br>
                        <input type="radio" id="nuclear4" name="nuclear" value="4">
                        <label for="nuclear4">4</label><br>
                        <p>Cellularity</p>
                        <input type="radio" id="cellularity1" name="cellularity" value="1">
                        <label for="cellularity1">1</label><br>
                        <input type="radio" id="cellularity2" name="cellularity" value="2">
                        <label for="cellularity2">2</label><br>
                        <input type="radio" id="cellularity3" name="cellularity" value="3">
                        <label for="cellularity3">3</label><br>
                        <input type="radio" id="cellularity4" name="cellularity" value="4">
                        <label for="cellularity4">4</label><br>

                        <div id="buttons">
                            <button type="next" id="previous-button">Previous</button>
                            <button type="submit" id="next-button">Next</button>
                            <button type="button" id="save-button">Save Progress to a CSV</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="index.js"></script>
</body>
</html>
